name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aiworkflow
          POSTGRES_USER: aiworkflow
          POSTGRES_PASSWORD: aiworkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiworkflow -d aiworkflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: backend/aiworkflow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend/aiworkflow
        run: chmod +x ./mvnw

      - name: Run backend tests
        working-directory: backend/aiworkflow
        run: ./mvnw clean test -Djava.version=21

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/aiworkflow/target/surefire-reports/
          if-no-files-found: ignore
