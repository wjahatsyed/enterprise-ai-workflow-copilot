spring:
  application:
    name: aiworkflow

  datasource:
    url: jdbc:postgresql://localhost:5432/aiworkflow
    username: aiworkflow
    password: aiworkflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics